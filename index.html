<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>旅ログ｜実地図テスト</title><link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#22343d;background:#f5f7f9}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:16px}h1{font-size:21px;margin:4px 0}.sub{font-size:12px;color:#64717a;margin:0 0 12px}.map-wrap{position:relative;border-radius:16px;overflow:hidden;background:#e4ece5;border:1px solid #c9d7d4}#map{height:min(58vh,480px);min-height:300px}.map-status{position:absolute;left:10px;top:10px;background:#ffffffec;border-radius:8px;padding:7px 9px;font-size:12px;z-index:3}.attribution-note{font-size:11px;color:#697781;margin:7px 0 14px}.panel{background:white;border-radius:13px;padding:13px;margin:10px 0;box-shadow:0 1px 5px #1c34400c}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}button,select{font:inherit;border:1px solid #c7d1d9;border-radius:10px;background:white;padding:10px 12px;min-height:42px}button.primary{background:#247cbd;color:white;border-color:#247cbd}button[aria-pressed=true]{border-color:#247cbd;background:#e5f2fc}input[type=range]{width:100%;accent-color:#247cbd;margin:13px 0}#percent{font-weight:bold}.muted{color:#667680;font-size:12px}#error{display:none;background:#fff1e7;border:1px solid #e8b99b;border-radius:10px;padding:12px;margin:10px 0;font-size:13px}#mode{font-weight:700}.marker{width:38px;height:38px;border-radius:50%;background:white;border:3px solid #247cbd;display:grid;place-items:center;box-shadow:0 2px 6px #0002}.marker svg{width:26px;height:26px;overflow:visible}.marker .vehicle{transform-origin:13px 13px}.small{font-size:12px}
</style></head><body><main><h1>旅ログ <span class="small">Ver.0.8 外部実地図テスト</span></h1><p class="sub">池袋駅 → サンシャインシティ周辺｜架空の移動デモ（実際の道路・鉄道路線に沿った経路ではありません）</p><div class="map-wrap"><div id="map"></div><div class="map-status" id="status">地図を読み込み中…</div></div><p class="attribution-note">地図: OpenFreeMap / OpenStreetMap contributors。外部地図タイルを読み込みます。位置情報の許可は不要です。</p><div id="error" role="alert"></div><div class="row"><button id="follow" aria-pressed="true">◎ 追従 ON</button><button id="overview">全体表示</button><button id="zoomout">−</button><button id="zoomin">＋</button></div><div class="panel"><div class="row between"><div><div id="mode">🚶 徒歩で移動中</div><div id="detail" class="muted">池袋駅から出発</div></div><span id="percent">0%</span></div><input id="slider" aria-label="再生位置" type="range" min="0" max="1000" value="0"><div class="row"><button class="primary" id="play">▶ 再生</button><button id="reset">↺ 最初から</button><select id="speed" aria-label="再生速度"><option value="1">1倍</option><option value="3" selected>3倍</option><option value="8">8倍</option></select></div></div><div class="panel"><b>旅の思い出</b><p id="memory">池袋駅からおでかけ！</p><p class="muted">写真・GPS取り込みは未実装です。地図表示と再生の動作確認用。</p></div></main><script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const points=[[139.7109,35.7295],[139.7120,35.7298],[139.7131,35.7300],[139.7143,35.7298],[139.7155,35.7292],[139.7170,35.7290],[139.7184,35.7289]];const notes=['池袋駅から出発！','駅東口方面へ','東口エリアを散策','街を移動中','東池袋方面へ','目的地までもう少し','サンシャインシティ周辺に到着！'];let progress=0,playing=false,last=0,raf=0,follow=true,mapReady=false,marker=null,map=null;const line=(coords)=>({type:'Feature',properties:{},geometry:{type:'LineString',coordinates:coords}});const empty=()=>({type:'FeatureCollection',features:[]});function current(){let f=progress*6,i=Math.min(5,Math.floor(f)),t=Math.min(1,f-i),a=points[i],b=points[i+1];return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]}function icon(mode,angle){let walk='<circle cx="13" cy="5" r="3" fill="#288765"/><path d="M13 9v8m0-5-6 3m6-3 6 3m-6 2-5 7m5-7 6 7" stroke="#288765" stroke-width="2.4" fill="none" stroke-linecap="round"/>';let train='<rect x="5" y="1" width="16" height="24" rx="5" fill="#f8faf8" stroke="#24865d" stroke-width="2"/><rect x="7" y="4" width="12" height="8" rx="2" fill="#b9dbd2"/><path d="M6 17h14" stroke="#299160" stroke-width="3"/><circle cx="9" cy="21" r="2" fill="#42565a"/><circle cx="17" cy="21" r="2" fill="#42565a"/>';let car='<rect x="5" y="1" width="16" height="24" rx="5" fill="#dc975b" stroke="#996039" stroke-width="1.5"/><rect x="7" y="5" width="12" height="6" rx="2" fill="#c5e5ed"/><rect x="7" y="17" width="12" height="5" rx="1" fill="#c5e5ed"/><path d="M4 5v5m18-5v5M4 17v5m18-5v5" stroke="#3f4e53" stroke-width="2.5"/>';return `<svg viewBox="0 0 26 26"><g class="vehicle" style="transform:rotate(${mode==='walk'?0:angle}deg)">${mode==='walk'?walk:mode==='train'?train:car}</g></svg>`}function draw(){let pos=current(),f=progress*6,i=Math.min(5,Math.floor(f)),mode=i<2?'walk':i<4?'train':'car',a=points[i],b=points[i+1];let dx=(b[0]-a[0])*Math.cos(pos[1]*Math.PI/180),dy=-(b[1]-a[1]),angle=Math.atan2(dy,dx)*180/Math.PI+90;$('mode').textContent=mode==='walk'?'🚶 徒歩で移動中':mode==='train'?'🚃 電車アイコン（デモ）':'🚗 車アイコン（デモ）';$('detail').textContent=follow?'地図がアイコンを追従':'地図位置を固定中';$('percent').textContent=Math.round(progress*100)+'%';$('slider').value=Math.round(progress*1000);$('memory').textContent=notes[Math.min(6,Math.floor(progress*6))];$('play').textContent=playing?'Ⅱ 一時停止':'▶ 再生';if(!mapReady)return;marker.setLngLat(pos);marker.getElement().innerHTML=icon(mode,angle);let arr=points.slice(0,i+1).concat([pos]);map.getSource('trail').setData(line(arr));if(follow)map.jumpTo({center:pos})}function stop(){playing=false;last=0;cancelAnimationFrame(raf);draw()}function tick(now){if(!playing)return;if(!last)last=now;let dt=Math.min((now-last)/1000,.1);last=now;progress=Math.min(1,progress+dt*Number($('speed').value)/40);if(progress>=1){playing=false;last=0}draw();if(playing)raf=requestAnimationFrame(tick)}$('play').addEventListener('click',()=>{if(playing){stop();return}if(progress>=1)progress=0;playing=true;last=0;draw();raf=requestAnimationFrame(tick)});$('reset').addEventListener('click',()=>{stop();progress=0;draw()});$('slider').addEventListener('input',e=>{stop();progress=Number(e.target.value)/1000;draw()});$('follow').addEventListener('click',()=>{follow=!follow;$('follow').setAttribute('aria-pressed',String(follow));$('follow').textContent=follow?'◎ 追従 ON':'◎ 追従 OFF';draw()});$('overview').addEventListener('click',()=>{follow=false;$('follow').setAttribute('aria-pressed','false');$('follow').textContent='◎ 追従 OFF';if(mapReady)map.fitBounds([[139.7100,35.7280],[139.7193,35.7310]],{padding:45,duration:500});draw()});$('zoomin').addEventListener('click',()=>{if(mapReady)map.zoomIn()});$('zoomout').addEventListener('click',()=>{if(mapReady)map.zoomOut()});if(typeof maplibregl==='undefined'){$('status').textContent='地図ライブラリ読み込み失敗';$('error').style.display='block';$('error').textContent='MapLibreの読み込みに失敗しました。インターネット接続やコンテンツブロッカーをご確認ください。再生操作自体は試せます。';draw();return}try{map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:points[0],zoom:15.4,attributionControl:true});map.addControl(new maplibregl.NavigationControl({showCompass:false}),'top-right');map.on('load',()=>{mapReady=true;map.addSource('route',{type:'geojson',data:line(points)});map.addLayer({id:'route-outline',type:'line',source:'route',paint:{'line-color':'#fff','line-width':9}});map.addLayer({id:'route-line',type:'line',source:'route',paint:{'line-color':'#8295a5','line-width':5,'line-dasharray':[1,1.5]}});map.addSource('trail',{type:'geojson',data:line([points[0],points[0]])});map.addLayer({id:'trail-line',type:'line',source:'trail',paint:{'line-color':'#287ec4','line-width':5}});const el=document.createElement('div');el.className='marker';marker=new maplibregl.Marker({element:el,anchor:'center'}).setLngLat(points[0]).addTo(map);$('status').textContent='実地図を表示中';draw()});let firstError=false;map.on('error',e=>{if(!firstError){firstError=true;$('status').textContent='地図の通信エラー';$('error').style.display='block';$('error').textContent='地図データの取得に失敗しました。ネットワーク・コンテンツブロッカーを確認してください。詳細: '+String(e.error?.message||'不明')}})}catch(e){$('status').textContent='地図を起動できません';$('error').style.display='block';$('error').textContent=String(e.message||e)}draw()})();
</script></body></html>
